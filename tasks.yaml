# TaskEngine task configuration
# See SPEC.md for detailed documentation
# This file demonstrates all available features

# ─── Global defaults ───
defaults:
  timeout: 300          # Default task timeout (seconds)
  retry: 0              # Default task retry count
  retry_delay: 60       # Retry interval (seconds)

  http_notify:
    # HTTP notification (can be overridden per task)
    url: "http://your-server/api/alert"
    on: failure

  email_notify:
    # Email notification (can be overridden per task)
    host: smtp.example.com
    port: 25
    ssl: false           # Default false; true uses SMTP_SSL (port 465 typically)
    username: user       # Optional; no auth if empty
    password: pass       # Optional
    from: bot@example.com
    to:
      - admin@example.com
    cc:
      - ops@example.com
    on: failure

# ─── Task definitions ───
tasks:
  # ── Example 1: Override defaults + multiple success conditions ──
  daily_report:
    description: "Daily data report"
    schedule: "0 3 * * *"
    timeout: 3600         # Override defaults.timeout
    retry: 2              # Override defaults.retry
    retry_delay: 120      # Override defaults.retry_delay

    # Parameter list; use {{param_name}} in commands
    params:
      - name: date
        default: "today"

    http_notify:
      # Override global http_notify
      url: "http://your-server/api/daily-report"
      on: always

    email_notify:
      # Override global email_notify (e.g., send email for every run on critical tasks)
      host: smtp.example.com
      port: 25
      from: bot@example.com
      to:
        - admin@example.com
        - manager@example.com
      on: always           # Send email regardless of success or failure

    steps:
      - name: prepare
        command: "python D:/scripts/prepare.py --date={{date}}"
        timeout: 300

      - name: process
        command: "D:/tools/process.exe -i D:/data/input.csv"
        timeout: 600
        retry: 1            # Step-level retry (independent of task-level retry)
        retry_delay: 30

      - name: verify
        command: "powershell D:/scripts/verify.ps1"
        timeout: 120
        success_conditions:
          # Multiple rules OR; conditions within a rule AND
          - exit_code: 0                              # Rule 1: exit code 0
          - exit_code: 1                              # Rule 2: exit code 1 AND output contains OK
            output_contains: "OK"

  # ── Example 2: output_not_contains + no exit_code condition ──
  data_sync:
    description: "Hourly data sync"
    schedule: "0 * * * *"
    steps:
      - name: sync
        command: "python D:/scripts/sync.py"
        success_conditions:
          # Rule 1: exit code 0 AND output contains "SYNC COMPLETE"
          - exit_code: 0
            output_contains: "SYNC COMPLETE"
          # Rule 2: don't check exit code, only check output contains "ALREADY UP TO DATE"
          - output_contains: "ALREADY UP TO DATE"

      - name: check
        command: "python D:/scripts/check.py"
        success_conditions:
          # Success as long as output does not contain ERROR (exit code not checked)
          - output_not_contains: "ERROR"

  # ── Example 3: step-level workdir + minimal config (all defaults inherited) ──
  monthly_cleanup:
    description: "Monthly cleanup"
    schedule: "0 2 1 * *"   # 1st of every month at 2 AM
    steps:
      - name: cleanup
        command: "cleanup.exe"
        workdir: "D:/scripts/cleanup"   # Specify working directory
        # success_conditions omitted → default [{exit_code: 0}]

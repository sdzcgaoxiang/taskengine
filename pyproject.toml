[project]
name = "taskengine"
version = "1.1.0"
description = "Lightweight scheduled task engine with multi-step scripting, monitoring dashboard, and email notifications"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
authors = [
    {name = "happyshaun"},
]
dependencies = [
    "APScheduler>=3.10.0,<4.0.0",
    "PyYAML>=6.0",
]

[project.scripts]
taskengine = "taskengine.cli:main"

[tool.setuptools.packages.find]
include = ["taskengine*"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
